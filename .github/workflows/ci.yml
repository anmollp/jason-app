name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Check formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialize providers
        working-directory: terraform
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate configuration
        working-directory: terraform
        run: terraform validate -no-color

      - name: Test security policy
        working-directory: terraform
        run: terraform test -no-color

      - name: Initialize deployment environment
        working-directory: terraform/environments/dev
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate deployment environment
        working-directory: terraform/environments/dev
        run: terraform validate -no-color

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser and accessibility tests
        run: pnpm run test:e2e

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test

      - name: E2E tests
        run: pnpm run test:e2e

      - name: Build
        run: pnpm run build

      - name: MCP lint
        run: pnpm exec eslint "mcp/{src,test}/**/*.ts"

      - name: Checkout pinned Jason CLI
        uses: actions/checkout@v4
        with:
          repository: anmollp/jason
          ref: 1a889e66c1b702dc04181dcf24a24a8713cc5a5e # v1.7.0
          path: .jason-cli
          persist-credentials: false

      - name: Build pinned Jason CLI
        working-directory: ${{ github.workspace }}/.jason-cli
        run: cargo build --locked

      - name: MCP build, protocol, parity, and integration tests
        env:
          JASON_CLI_PATH: ${{ github.workspace }}/.jason-cli/target/debug/jason
        run: pnpm --filter @anmollp/jason-mcp test
