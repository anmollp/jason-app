<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1620" viewBox="0 0 1440 1620" role="img" aria-labelledby="title desc">
  <title id="title">AskJason system architecture</title>
  <desc id="desc">Architecture diagram showing the browser, Next.js frontend, private NestJS backend, Jason Rust CLI, approval-gated AI trust path, Firestore, Secret Manager, OpenAI APIs, and local MCP server.</desc>
  <defs>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#34d399" />
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#60a5fa" />
    </marker>
    <style>
      .bg { fill: #09090b; }
      .section { fill: #18181b; stroke: #3f3f46; stroke-width: 2; rx: 18; }
      .box { fill: #27272a; stroke: #71717a; stroke-width: 2; rx: 14; }
      .frontend { fill: #0f2f2a; stroke: #34d399; }
      .backend { fill: #172554; stroke: #60a5fa; }
      .cli { fill: #3b2f12; stroke: #fbbf24; }
      .provider { fill: #3b1028; stroke: #fb7185; }
      .state { fill: #2e1065; stroke: #a78bfa; }
      .mcp { fill: #052e2b; stroke: #2dd4bf; }
      .title { fill: #fafafa; font: 700 36px Arial, sans-serif; }
      .sectionTitle { fill: #fafafa; font: 700 24px Arial, sans-serif; }
      .label { fill: #fafafa; font: 700 19px Arial, sans-serif; }
      .small { fill: #d4d4d8; font: 15px Arial, sans-serif; }
      .mono { fill: #d4d4d8; font: 14px Menlo, Consolas, monospace; }
      .muted { fill: #a1a1aa; font: 14px Arial, sans-serif; }
      .step { fill: #34d399; font: 700 13px Menlo, Consolas, monospace; }
      .arrow { stroke: #34d399; stroke-width: 3; fill: none; marker-end: url(#arrow-green); }
      .returnArrow { stroke: #60a5fa; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .dash { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="1620" />
  <rect x="62" y="38" width="58" height="58" rx="18" fill="#18181b" stroke="#3f3f46" />
  <circle cx="83" cy="63" r="5" fill="#34d399" />
  <circle cx="101" cy="63" r="5" fill="#34d399" />
  <text x="92" y="83" text-anchor="middle" font-size="17" font-weight="700" fill="#fafafa">{}</text>
  <text class="title" x="140" y="70">AskJason System Design</text>
  <text class="muted" x="140" y="96">Deterministic JSON tools, approval-gated AI, and production trust boundaries.</text>

  <rect class="section" x="48" y="130" width="1344" height="300" />
  <text class="sectionTitle" x="80" y="174">1. Runtime Components</text>

  <rect class="box" x="82" y="230" width="170" height="120" />
  <text class="label" x="126" y="270">Browser</text>
  <text class="small" x="108" y="301">Workspace state</text>
  <text class="small" x="108" y="325">Apply / Discard</text>

  <rect class="box frontend" x="302" y="210" width="210" height="160" />
  <text class="label" x="340" y="250">Next.js Frontend</text>
  <text class="small" x="330" y="282">Playground + /ai</text>
  <text class="small" x="330" y="306">Same-origin proxies</text>
  <text class="small" x="330" y="330">Cloud Run ID token</text>

  <rect class="box backend" x="562" y="210" width="220" height="160" />
  <text class="label" x="602" y="250">NestJS Backend</text>
  <text class="small" x="590" y="282">Validation + agent</text>
  <text class="small" x="590" y="306">Quota + moderation</text>
  <text class="small" x="590" y="330">Safe summaries</text>

  <rect class="box cli" x="832" y="230" width="180" height="120" />
  <text class="label" x="877" y="270">Jason CLI</text>
  <text class="small" x="858" y="301">JSON authority</text>
  <text class="small" x="858" y="325">Fixed stdin calls</text>

  <rect class="box provider" x="1062" y="200" width="270" height="78" />
  <text class="label" x="1112" y="232">OpenAI APIs</text>
  <text class="small" x="1090" y="257">Moderation + Responses</text>
  <rect class="box state" x="1062" y="296" width="270" height="78" />
  <text class="label" x="1105" y="328">GCP State</text>
  <text class="small" x="1090" y="353">Firestore + Secret Manager</text>

  <path class="arrow" d="M252 290 H290" />
  <path class="arrow" d="M512 290 H550" />
  <path class="arrow" d="M782 290 H820" />
  <path class="arrow dash" d="M782 250 C895 180 965 190 1050 235" />
  <path class="arrow dash" d="M782 330 C900 390 970 380 1050 338" />

  <rect class="section" x="48" y="468" width="1344" height="292" />
  <text class="sectionTitle" x="80" y="512">2. Deterministic Request Path</text>

  <rect class="box frontend" x="82" y="570" width="240" height="118" />
  <text class="label" x="130" y="610">Tool Workspace</text>
  <text class="mono" x="112" y="642">Formatter · Diff</text>
  <text class="mono" x="112" y="666">Patch · Pointer</text>

  <rect class="box frontend" x="372" y="550" width="240" height="158" />
  <text class="label" x="426" y="590">Next.js Proxy</text>
  <text class="mono" x="400" y="622">POST /api/{tool}</text>
  <text class="small" x="400" y="650">Private backend auth</text>
  <text class="small" x="400" y="676">5 MiB document path</text>

  <rect class="box backend" x="662" y="550" width="240" height="158" />
  <text class="label" x="718" y="590">API Controller</text>
  <text class="small" x="690" y="622">Validate request</text>
  <text class="small" x="690" y="650">Run fixed command</text>
  <text class="small" x="690" y="676">Normalize response</text>

  <rect class="box cli" x="952" y="550" width="260" height="158" />
  <text class="label" x="1022" y="590">Jason Runner</text>
  <text class="mono" x="980" y="622">format · diff</text>
  <text class="mono" x="980" y="650">patch · pointer</text>
  <text class="small" x="980" y="678">shell: false · stdin</text>

  <path class="arrow" d="M322 629 H360" />
  <path class="arrow" d="M612 629 H650" />
  <path class="arrow" d="M902 629 H940" />
  <path class="returnArrow" d="M1212 720 C940 752 520 752 322 700" />
  <text class="mono" x="585" y="742">stable deterministic response</text>

  <rect class="section" x="48" y="798" width="1344" height="414" />
  <text class="sectionTitle" x="80" y="842">3. Approval-Gated AI Trust Path</text>

  <rect class="box" x="80" y="900" width="170" height="136" />
  <text class="step" x="102" y="928">01 REQUEST</text>
  <text class="label" x="102" y="962">Selected context</text>
  <text class="small" x="102" y="991">32 KiB transport</text>
  <text class="small" x="102" y="1015">16 KiB context</text>

  <rect class="box state" x="282" y="900" width="170" height="136" />
  <text class="step" x="304" y="928">02 RESERVE</text>
  <text class="label" x="304" y="962">Identity + quota</text>
  <text class="small" x="304" y="991">Firestore lease</text>
  <text class="small" x="304" y="1015">Spend reservation</text>

  <rect class="box provider" x="484" y="900" width="170" height="136" />
  <text class="step" x="506" y="928">03 MODERATE</text>
  <text class="label" x="506" y="962">Instruction</text>
  <text class="small" x="506" y="991">Fail closed</text>
  <text class="small" x="506" y="1015">No content logs</text>

  <rect class="box provider" x="686" y="900" width="170" height="136" />
  <text class="step" x="708" y="928">04 ROUTE</text>
  <text class="label" x="708" y="962">Responses API</text>
  <text class="small" x="708" y="991">4 fixed tools</text>
  <text class="small" x="708" y="1015">store: false</text>

  <rect class="box cli" x="888" y="900" width="170" height="136" />
  <text class="step" x="910" y="928">05 VALIDATE</text>
  <text class="label" x="910" y="962">Rust execution</text>
  <text class="small" x="910" y="991">Strict schema</text>
  <text class="small" x="910" y="1015">Jason-valid result</text>

  <rect class="box backend" x="1090" y="900" width="170" height="136" />
  <text class="step" x="1112" y="928">06 PROPOSE</text>
  <text class="label" x="1112" y="962">Safe summary</text>
  <text class="small" x="1112" y="991">Proposal only</text>
  <text class="small" x="1112" y="1015">Usage accounted</text>

  <path class="arrow" d="M250 968 H270" />
  <path class="arrow" d="M452 968 H472" />
  <path class="arrow" d="M654 968 H674" />
  <path class="arrow" d="M856 968 H876" />
  <path class="arrow" d="M1058 968 H1078" />

  <rect class="box frontend" x="330" y="1080" width="780" height="82" />
  <text class="step" x="360" y="1110">07 USER CONTROL</text>
  <text class="label" x="530" y="1110">Review proposal → Apply or Discard in the browser</text>
  <text class="small" x="360" y="1140">No model response can mutate workspace state without this explicit local action.</text>

  <rect class="section" x="48" y="1250" width="1344" height="304" />
  <text class="sectionTitle" x="80" y="1294">4. Production and Local Surfaces</text>

  <rect class="box frontend" x="82" y="1350" width="270" height="132" />
  <text class="label" x="126" y="1390">Public Cloud Run</text>
  <text class="mono" x="112" y="1422">JASON_API_BASE_URL</text>
  <text class="mono" x="112" y="1448">JASON_API_AUDIENCE</text>

  <rect class="box backend" x="408" y="1350" width="270" height="132" />
  <text class="label" x="452" y="1390">Private Cloud Run</text>
  <text class="mono" x="438" y="1422">AI_ENABLED · quotas</text>
  <text class="mono" x="438" y="1448">JASON_CLI_PATH</text>

  <rect class="box state" x="734" y="1350" width="270" height="132" />
  <text class="label" x="790" y="1390">Private GCP State</text>
  <text class="small" x="764" y="1422">Firestore metadata</text>
  <text class="small" x="764" y="1448">Pinned secret versions</text>

  <rect class="box mcp" x="1060" y="1350" width="270" height="132" />
  <text class="label" x="1124" y="1390">Local MCP</text>
  <text class="small" x="1090" y="1422">stdio · same contracts</text>
  <text class="small" x="1090" y="1448">No hosted AI or writes</text>

  <path class="arrow" d="M352 1416 H396" />
  <path class="arrow" d="M678 1416 H722" />
  <path class="arrow dash" d="M1060 1496 C900 1540 530 1540 408 1496" />
  <text class="muted" x="80" y="1524">Terraform owns infrastructure; path-filtered workflows update service images. Both services remain min 0 / max 1.</text>
</svg>
